[package]
name = "localsearch-desktop"
description = "Resident keyboard-first LocalSearch Tauri 2 client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
localsearch-agent-api = { path = "../agent-api" }
localsearch-core = { path = "../core" }
localsearch-local-transport = { path = "../local-transport", features = ["agent-wire"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
tauri = { version = "2.11.5", default-features = false, features = ["common-controls-v6", "wry"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.3"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
