[package]
name = "localsearch-catalog-spike"
description = "Experimental Tantivy catalog retrieval spike for START-002"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4.44", default-features = false, features = ["clock", "serde"] }
localsearch-benchmark-data = { path = "../benchmark-data" }
