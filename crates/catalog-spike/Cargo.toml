serde_json = "1.0.151"
sysinfo = "0.38.3"
tantivy = { version = "0.26.1", default-features = false, features = ["lz4-compression", "mmap"] }
thiserror.workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
