[package]
name = "localsearch-content-index"
description = "Opt-in bounded plaintext content index for LocalSearch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
localsearch-core = { path = "../core" }
localsearch-filesystem-graph = { path = "../filesystem-graph" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
sysinfo = "0.38.4"
tantivy = { version = "0.26.1", default-features = false, features = ["lz4-compression", "mmap"] }
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
localsearch-platform-core = { path = "../platform-core" }
localsearch-windows-fs = { path = "../windows-fs" }

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true
