version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
localsearch-core = { path = "../core" }
localsearch-benchmark-data = { path = "../benchmark-data" }
localsearch-filesystem-graph = { path = "../filesystem-graph" }
localsearch-platform-core = { path = "../platform-core" }
serde.workspace = true
serde_json.workspace = true
tantivy = { version = "0.26.1", default-features = false, features = ["lz4-compression", "mmap"] }
thiserror.workspace = true
unicode-normalization = "0.1.25"

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true
